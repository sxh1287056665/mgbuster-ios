workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 120

    environment:
      vars:
        PAYLOAD_URL: "https://github.com/sxh1287056665/mgbuster-ios/releases/download/unity-payload/Unity-iPhone-xcode.tar.gz"

    scripts:
      - name: Show toolchain
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Fetch Unity Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L --retry 5 --retry-delay 5 -o payload.tar.gz "$PAYLOAD_URL"
          ls -lh payload.tar.gz
          mkdir -p xcode
          tar -xzf payload.tar.gz -C xcode
          echo "--- top level ---"
          ls -la xcode
          du -sh xcode/iOS

      - name: Patch project for modern Xcode
        script: |
          set -e
          cd "$CM_BUILD_DIR/xcode/iOS"
          PBX="Unity-iPhone.xcodeproj/project.pbxproj"

          # 1) 关闭 bitcode（Xcode 14+ 已移除该特性）
          /usr/bin/sed -i '' 's/ENABLE_BITCODE = YES;/ENABLE_BITCODE = NO;/g' "$PBX"

          # 2) 统一最低系统版本，规避 libarclite 缺失
          /usr/bin/sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBX"

          # 3) 移除 -mno-thumb：Unity 2019.4 为 ARMv7 生成，新版 clang 在 arm64 目标上拒绝该选项
          /usr/bin/sed -i '' '/"-mno-thumb",/d' "$PBX"
          /usr/bin/sed -i '' 's/GCC_THUMB_SUPPORT = NO;/GCC_THUMB_SUPPORT = YES;/g' "$PBX"

          # 4) 恢复可执行位：Windows 打包时丢失，导致 Run Script 阶段 Permission denied
          find . -name '*.sh' -type f -print -exec chmod 755 {} \;
          chmod 755 MapFileParser.sh process_symbols.sh 2>/dev/null || true

          echo "--- checks ---"
          echo "bitcode_NO: $(grep -c 'ENABLE_BITCODE = NO;' "$PBX" || true)"
          echo "mno_thumb_left: $(grep -c 'mno-thumb' "$PBX" || true)"
          echo "deployment_targets:"
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;' "$PBX" | sort -u
          ls -l MapFileParser.sh process_symbols.sh

      - name: Archive
        script: |
          set -e
          cd "$CM_BUILD_DIR/xcode/iOS"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Unity-iPhone.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        script: |
          set -e
          ARCH="$CM_BUILD_DIR/build/Unity-iPhone.xcarchive"
          APPS="$ARCH/Products/Applications"
          echo "--- apps in archive ---"
          ls -la "$APPS"

          APP=$(find "$APPS" -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found in $APPS"
            exit 1
          fi
          echo "APP=$APP"
          du -sh "$APP"

          cd "$CM_BUILD_DIR/build"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          APPNAME=$(basename "$APP")
          echo "APPNAME=$APPNAME"

          zip -qry MGBuster-unsigned.ipa Payload
          ls -lh MGBuster-unsigned.ipa
          unzip -l MGBuster-unsigned.ipa | head -n 15

          echo "--- app info ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$APPNAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "Payload/$APPNAME/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "Payload/$APPNAME/Info.plist" || true
          echo "--- binary arch ---"
          lipo -info "Payload/$APPNAME/$APPNAME" 2>/dev/null || file "Payload/$APPNAME/$APPNAME" || true

    artifacts:
      - build/MGBuster-unsigned.ipa
      - xcode/iOS/*.log
