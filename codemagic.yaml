workflows:
  ios-unsigned:
    name: Build unsigned IPA
    max_build_duration: 120

    environment:
      vars:
        PAYLOAD_URL: "https://github.com/sxh1287056665/mgbuster-ios/releases/download/unity-payload/Unity-iPhone-xcode.tar.gz"

    scripts:
      - name: Show toolchain
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Fetch Unity Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L --retry 5 --retry-delay 5 -o payload.tar.gz "$PAYLOAD_URL"
          ls -lh payload.tar.gz
          mkdir -p xcode
          tar -xzf payload.tar.gz -C xcode
          echo "--- top level ---"
          ls -la xcode
          du -sh xcode/iOS

      - name: Patch project for modern Xcode
        script: |
          set -e
          cd "$CM_BUILD_DIR/xcode/iOS"
          PBX="Unity-iPhone.xcodeproj/project.pbxproj"
          /usr/bin/sed -i '' 's/ENABLE_BITCODE = YES;/ENABLE_BITCODE = NO;/g' "$PBX"
          /usr/bin/sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9][0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBX"
          echo "ENABLE_BITCODE=NO occurrences: $(grep -c 'ENABLE_BITCODE = NO;' "$PBX" || true)"
          echo "deployment targets:"
          grep -o 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;' "$PBX" | sort -u

      - name: Archive
        script: |
          set -e
          cd "$CM_BUILD_DIR/xcode/iOS"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/Unity-iPhone.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        script: |
          set -e
          APP="$CM_BUILD_DIR/build/Unity-iPhone.xcarchive/Products/Applications/Unity-iPhone.app"
          test -d "$APP"
          cd "$CM_BUILD_DIR/build"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MGBuster-unsigned.ipa Payload
          ls -lh MGBuster-unsigned.ipa
          echo "--- app info ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Unity-iPhone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Unity-iPhone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Unity-iPhone.app/Info.plist || true

    artifacts:
      - build/MGBuster-unsigned.ipa
      - xcode/iOS/*.log
