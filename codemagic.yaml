workflows:
  ios-link-test:
    name: SiNiSistar2 iOS app build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: 16.4
      vars:
        PAYLOAD_URL: "https://github.com/sxh1287056665/mgbuster-ios/releases/download/unity-ios-linktest/unity-ios-payload.zip"
    scripts:
      - name: Fetch payload
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "--- downloading payload ---"
          curl -L --retry 3 --retry-delay 5 -o payload.zip "$PAYLOAD_URL"
          ls -la payload.zip
          echo "--- unpacking ---"
          # -o: overwrite without prompting. CI has no stdin, so any prompt
          #     would be answered "none" and unzip would exit 1.
          unzip -q -o payload.zip -d .
          echo "--- tree ---"
          ls -la
          du -sh Libraries Frameworks Data 2>/dev/null || true

      - name: Verify GameAssembly.dylib
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "=== Mach-O header ==="
          otool -hv Frameworks/GameAssembly.dylib | sed -n '2,3p'
          echo "=== build version (expect platform IOS) ==="
          vtool -show-build Frameworks/GameAssembly.dylib || true
          echo "=== install name (rewritten to @rpath at build time) ==="
          otool -D Frameworks/GameAssembly.dylib
          echo "=== exported il2cpp_ symbols (expect 241) ==="
          nm -gU Frameworks/GameAssembly.dylib | grep -c '_il2cpp_' || echo 0

      - name: Verify engine contract
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "=== engine undefined il2cpp_ symbols (expect 155) ==="
          nm -u Libraries/libiPhone-lib.a 2>/dev/null | grep '_il2cpp' | awk '{print $NF}' | sort -u | wc -l || echo 0
          echo "=== Data/ layout ==="
          find Data -type f | head -20
          echo "total: $(find Data -type f | wc -l | tr -d ' ') files, $(du -sh Data | cut -f1)"

      - name: Build app
        script: |
          # pipefail is essential: without it a pipeline's status is the last
          # command's (tail), so a failing build would report success.
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          chmod +x build_ios.sh
          set +e
          ./build_ios.sh 2>&1 | tail -200
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===================== BUILD FAILED (rc=$rc) ====================="
            echo "--- compile errors ---"
            grep -E 'error:' out/build.log 2>/dev/null | head -40 || true
            echo "--- linker errors ---"
            grep -iE 'undefined symbol|duplicate symbol|ld: ' out/build.log 2>/dev/null | head -60 || true
            echo "--- first failing command ---"
            grep -E '\*\* BUILD FAILED|The following build commands failed' -A4 out/build.log 2>/dev/null | head -24 || true
            exit 1
          fi
          echo "build script reported success"

      - name: Inspect app
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP="out/build/Release-iphoneos/SiNiSistar2.app"
          echo "=== bundle tree (depth 2) ==="
          find "$APP" -maxdepth 2 | head -40
          echo
          echo "=== main binary ==="
          lipo -info "$APP/SiNiSistar2"
          otool -L "$APP/SiNiSistar2" | head -12
          echo
          echo "=== UnityFramework ==="
          lipo -info "$APP/Frameworks/UnityFramework.framework/UnityFramework"
          echo "--- load commands referencing GameAssembly ---"
          otool -L "$APP/Frameworks/UnityFramework.framework/UnityFramework" | grep -i gameassembly || echo "  (none)"
          echo "--- rpaths ---"
          otool -l "$APP/Frameworks/UnityFramework.framework/UnityFramework" | grep -A2 LC_RPATH | grep path || true
          echo
          echo "=== embedded GameAssembly framework ==="
          ls -lR "$APP/Frameworks/GameAssembly.framework"
          otool -D "$APP/Frameworks/GameAssembly.framework/GameAssembly"
          echo "--- signature ---"
          codesign -dv "$APP/Frameworks/GameAssembly.framework" 2>&1 | head -8 || true
          echo
          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist"
          echo
          echo "=== size ==="
          du -sh "$APP"
          ls -lh out/*.ipa 2>/dev/null || true
    artifacts:
      - out/build.log
      - out/*.ipa
      - out/build/Release-iphoneos/*.app
