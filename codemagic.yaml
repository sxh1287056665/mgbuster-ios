# ============================================================================
# APK → iOS 未签名 IPA：Codemagic 主路径（Xcode-only）
#
# 分工：
#   Windows 侧（本机） = Unity 2019.4.18f1 生成 Unity-iPhone.xcodeproj
#                        并已完成 pbxproj / Info.plist 归一化
#   Codemagic（macOS） = 只做 xcodebuild + Payload 打包，产出 unsigned IPA
#   用户侧（Windows）  = 全能签 zsign 自签 + 装机（证书不上云）
#
# 工程来源：GitHub release 直链（公开仓库，curl 免鉴权）
# 实例：mac_mini_m2（Apple Silicon，Xcode 15.4）。此路径不需要 Unity，
#       所以不存在 Intel Unity 在 Apple Silicon + macOS 14 上的兼容问题。
# ============================================================================

workflows:
  base2-unsigned:
    name: Onnanoko6 unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 15.4
      vars:
        APP_NAME: Onnanoko6
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.port.onnanoko6
        PROJECT_ZIP_URL: https://github.com/sxh1287056665/mgbuster-ios/releases/download/ios-unsigned-v1/ios-base2.zip
        EXPECT_UNITY: 2019.4.18f1
    scripts:
      - name: 拉取 Xcode 工程
        script: |
          set -euo pipefail
          mkdir -p /tmp/proj
          curl -fL --retry 3 --retry-delay 5 --progress-bar \
            -o /tmp/project.zip "$PROJECT_ZIP_URL"
          ls -l /tmp/project.zip
          # 工程由 Python zipfile 生成（正斜杠路径 + unix 权限位），unzip 即可
          unzip -q /tmp/project.zip -d /tmp/proj
          test -d "/tmp/proj/$XCODE_PROJECT"
          test -f "/tmp/proj/$XCODE_PROJECT/project.pbxproj"
          echo "--- 顶层 ---"
          ls -1 /tmp/proj
          echo "--- 体积 ---"
          du -sh /tmp/proj

      - name: 校验并兜底修补工程
        script: |
          set -euo pipefail
          cd /tmp/proj
          PBX="$XCODE_PROJECT/project.pbxproj"
          cp "$PBX" "$PBX.orig"
          # 幂等兜底：本机已归一化，这些替换通常 0 命中，只为防回归
          perl -0pi -e 's/ENABLE_BITCODE = YES/ENABLE_BITCODE = NO/g' "$PBX"
          perl -0pi -e 's/ARCHS = armv7;/ARCHS = arm64;/g' "$PBX"
          perl -0pi -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBX"

          echo "--- 硬断言 ---"
          test "$(grep -c 'ENABLE_BITCODE = YES' "$PBX" || true)" = "0"
          test "$(grep -c 'ARCHS = armv7;' "$PBX" || true)" = "0"
          test "$(grep -c 'iPhone Developer' "$PBX" || true)" = "0"
          test "$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBX" || true)" -ge 1
          echo "bitcode=NO ok  arm64 ok  unsigned ok  bundle=${BUNDLE_ID}"

          # Info.plist 必须声明 arm64 + metal，否则真机不装
          PLIST="$XCODE_PROJECT/../Info.plist"
          [ -f "$PLIST" ] || PLIST="Info.plist"
          grep -q '<string>arm64</string>' "$PLIST"
          grep -q '<string>metal</string>' "$PLIST"
          test "$(grep -c '<string>armv7</string>' "$PLIST" || true)" = "0"
          echo "Info.plist ok"

          echo "--- Live2D 链接（base3 才有，base2 为 0）---"
          grep -c 'libLive2DCubismCore' "$PBX" || true

          echo "--- schemes ---"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: 编译未签名 .app
        script: |
          set -euo pipefail
          cd /tmp/proj
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log | tail -80
          grep -q 'BUILD SUCCEEDED' /tmp/xcodebuild.log
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -d "$APP"
          echo "APP=$APP"
          du -sh "$APP"

          echo "--- 产物硬标记 ---"
          test -f "$APP/Data/Managed/Metadata/global-metadata.dat" && echo "ok global-metadata"
          test -f "$APP/Data/globalgamemanagers" && echo "ok globalgamemanagers"
          test -f "$APP/Data/level0" && echo "ok level0"
          test -d "$APP/Frameworks/UnityFramework.framework" && echo "ok UnityFramework"
          echo "arch  : $(lipo -archs "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")")"
          echo "binary: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "minOS : $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "caps  : $(/usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist")"

      - name: 打包 Payload 未签名 ipa
        script: |
          set -euo pipefail
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          WORK=/tmp/ipa
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -a "$APP" "$WORK/Payload/"
          # UnityFramework 的 CFBundleIdentifier 必须区别于主 app，否则自签工具会覆盖嵌套签名
          UF="$WORK/Payload/$(basename "$APP")/Frameworks/UnityFramework.framework"
          if [ -d "$UF" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}.framework" "$UF/Info.plist" || true
            echo "UnityFramework id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$UF/Info.plist")"
          fi
          cd "$WORK"
          # ASTC 已压缩，deflate 几乎无收益且耗时，用 store
          zip -0 -qry "/tmp/${APP_NAME}-unsigned.ipa" Payload
          ditto -c -k --keepParent "$APP" "/tmp/${APP_NAME}-app.zip"
          ls -lh /tmp/*.ipa /tmp/*.zip
          echo "--- ipa 自检 ---"
          unzip -l "/tmp/${APP_NAME}-unsigned.ipa" | head -12

    artifacts:
      - /tmp/*.ipa
      - /tmp/*-app.zip
      - /tmp/xcodebuild.log

  base3-unsigned:
    name: KIZUNA PLAYER unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 15.4
      vars:
        APP_NAME: KIZUNAPlayer
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.port.kizunaplyer
        PROJECT_ZIP_URL: https://github.com/sxh1287056665/mgbuster-ios/releases/download/ios-unsigned-v1/ios-base3.zip
        EXPECT_UNITY: 2019.4.18f1
    scripts:
      - name: 拉取 Xcode 工程
        script: |
          set -euo pipefail
          mkdir -p /tmp/proj
          curl -fL --retry 3 --retry-delay 5 --progress-bar \
            -o /tmp/project.zip "$PROJECT_ZIP_URL"
          ls -l /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/proj
          test -d "/tmp/proj/$XCODE_PROJECT"
          test -f "/tmp/proj/$XCODE_PROJECT/project.pbxproj"
          echo "--- 顶层 ---"
          ls -1 /tmp/proj
          du -sh /tmp/proj

      - name: 校验并兜底修补工程
        script: |
          set -euo pipefail
          cd /tmp/proj
          PBX="$XCODE_PROJECT/project.pbxproj"
          cp "$PBX" "$PBX.orig"
          perl -0pi -e 's/ENABLE_BITCODE = YES/ENABLE_BITCODE = NO/g' "$PBX"
          perl -0pi -e 's/ARCHS = armv7;/ARCHS = arm64;/g' "$PBX"
          perl -0pi -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBX"

          echo "--- 硬断言 ---"
          test "$(grep -c 'ENABLE_BITCODE = YES' "$PBX" || true)" = "0"
          test "$(grep -c 'ARCHS = armv7;' "$PBX" || true)" = "0"
          test "$(grep -c 'iPhone Developer' "$PBX" || true)" = "0"
          test "$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBX" || true)" -ge 1
          echo "bitcode=NO ok  arm64 ok  unsigned ok  bundle=${BUNDLE_ID}"

          PLIST="Info.plist"
          grep -q '<string>arm64</string>' "$PLIST"
          grep -q '<string>metal</string>' "$PLIST"
          test "$(grep -c '<string>armv7</string>' "$PLIST" || true)" = "0"
          echo "Info.plist ok"

          echo "--- Live2D 链接（关键）---"
          test "$(grep -c 'libLive2DCubismCore' "$PBX")" -ge 3
          test -f "Libraries/Plugins/iOS/libLive2DCubismCore.a"
          test -f "Libraries/Plugins/iOS/Live2DCubismCoreForceLink.mm"
          echo "Live2D ok"

          echo "--- schemes ---"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: 编译未签名 .app
        script: |
          set -euo pipefail
          cd /tmp/proj
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log | tail -80
          grep -q 'BUILD SUCCEEDED' /tmp/xcodebuild.log
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -d "$APP"
          echo "APP=$APP"
          du -sh "$APP"

          echo "--- 产物硬标记 ---"
          test -f "$APP/Data/Managed/Metadata/global-metadata.dat" && echo "ok global-metadata"
          test -f "$APP/Data/globalgamemanagers" && echo "ok globalgamemanagers"
          test -f "$APP/Data/level0" && echo "ok level0"
          test -d "$APP/Frameworks/UnityFramework.framework" && echo "ok UnityFramework"
          echo "arch  : $(lipo -archs "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")")"
          echo "bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "minOS : $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"

          echo "--- Live2D 符号落盘（防 dead-strip）---"
          FW="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          N=$(nm -gU "$FW" 2>/dev/null | grep -c '_csm' || true)
          echo "csm symbols: $N"
          test "$N" -ge 20

      - name: 打包 Payload 未签名 ipa
        script: |
          set -euo pipefail
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          WORK=/tmp/ipa
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -a "$APP" "$WORK/Payload/"
          UF="$WORK/Payload/$(basename "$APP")/Frameworks/UnityFramework.framework"
          if [ -d "$UF" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}.framework" "$UF/Info.plist" || true
            echo "UnityFramework id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$UF/Info.plist")"
          fi
          cd "$WORK"
          zip -0 -qry "/tmp/${APP_NAME}-unsigned.ipa" Payload
          ditto -c -k --keepParent "$APP" "/tmp/${APP_NAME}-app.zip"
          ls -lh /tmp/*.ipa /tmp/*.zip
          echo "--- ipa 自检 ---"
          unzip -l "/tmp/${APP_NAME}-unsigned.ipa" | head -12

    artifacts:
      - /tmp/*.ipa
      - /tmp/*-app.zip
      - /tmp/xcodebuild.log
