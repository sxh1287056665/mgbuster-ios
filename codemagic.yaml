workflows:
  ios-link-test:
    name: SiNiSistar2 iOS link test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      vars:
        PAYLOAD_URL: "https://github.com/sxh1287056665/mgbuster-ios/releases/download/unity-ios-linktest/unity-ios-payload.zip"
    scripts:
      - name: Fetch payload
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "--- downloading payload ---"
          curl -L --retry 3 --retry-delay 5 -o payload.zip "$PAYLOAD_URL"
          ls -la payload.zip
          echo "--- unpacking ---"
          # -o: overwrite without prompting. CI has no stdin, so any prompt
          #     (e.g. a file already present from the repo checkout) would be
          #     answered "none" and unzip would exit 1.
          unzip -q -o payload.zip -d .
          echo "--- tree ---"
          ls -la
          du -sh Libraries Frameworks 2>/dev/null || true
          echo "--- engine + dylib sizes ---"
          ls -l Libraries/libiPhone-lib.a Frameworks/GameAssembly.dylib

      - name: Verify GameAssembly.dylib
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "=== Mach-O header ==="
          otool -hv Frameworks/GameAssembly.dylib | sed -n '2,3p'
          echo "=== build version (expect platform IOS) ==="
          vtool -show-build Frameworks/GameAssembly.dylib || true
          echo "=== linked dylibs ==="
          otool -L Frameworks/GameAssembly.dylib
          echo "=== exported il2cpp_ symbols (expect 241) ==="
          nm -gU Frameworks/GameAssembly.dylib | grep -c '_il2cpp_' || echo 0

      - name: Verify engine contract
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "=== engine undefined il2cpp_ symbols (expect 155) ==="
          nm -u Libraries/libiPhone-lib.a 2>/dev/null | grep '_il2cpp' | awk '{print $NF}' | sort -u | wc -l || echo 0
          echo "=== first 20 ==="
          nm -u Libraries/libiPhone-lib.a 2>/dev/null | grep '_il2cpp' | awk '{print $NF}' | sort -u | head -20 || true

      - name: Build UnityFramework
        script: |
          # pipefail is essential: without it a pipeline's status is the last
          # command's (tail), so a failing build would report success.
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          chmod +x build_ios.sh
          set +e
          ./build_ios.sh 2>&1 | tail -150
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===================== BUILD FAILED (rc=$rc) ====================="
            echo "--- compile errors ---"
            grep -E 'error:' out/build.log 2>/dev/null | head -40 || true
            echo "--- linker errors ---"
            grep -iE 'undefined symbol|duplicate symbol|ld: ' out/build.log 2>/dev/null | head -60 || true
            echo "--- first failing command ---"
            grep -E '\*\* BUILD FAILED|The following build commands failed' -A3 out/build.log 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "build script reported success"

      - name: Report
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "=== produced binaries ==="
          find out -name 'UnityFramework' -type f 2>/dev/null | while read f; do
            echo "--- $f"
            ls -lh "$f"
            lipo -info "$f" || true
          done
          find out -name '*.app' -maxdepth 5 2>/dev/null | head
    artifacts:
      - out/build.log
      - out/**/UnityFramework
      - out/**/*.app
