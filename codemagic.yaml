# ============================================================================
# APK 鈫?iOS 鏈鍚?IPA锛欳odemagic 涓昏矾寰勶紙Xcode-only锛?#
# 鍒嗗伐锛?#   Windows 渚э紙鏈満锛?= Unity 2019.4.18f1 鐢熸垚 Unity-iPhone.xcodeproj
#                        骞跺凡瀹屾垚 pbxproj / Info.plist 褰掍竴鍖?#   Codemagic锛坢acOS锛?= 鍙仛 xcodebuild + Payload 鎵撳寘锛屼骇鍑?unsigned IPA
#   鐢ㄦ埛渚э紙Windows锛? = 鍏ㄨ兘绛?zsign 鑷 + 瑁呮満锛堣瘉涔︿笉涓婁簯锛?#
# 宸ョ▼鏉ユ簮锛欸itHub release 鐩撮摼锛堝叕寮€浠撳簱锛宑url 鍏嶉壌鏉冿級
# 瀹炰緥锛歮ac_mini_m2锛圓pple Silicon锛孹code 16.4 / macOS 15.5锛夈€傛璺緞涓嶉渶瑕?Unity锛?#       鎵€浠ヤ笉瀛樺湪 Intel Unity 鍦?Apple Silicon + macOS 14 涓婄殑鍏煎闂銆?# ============================================================================

workflows:
  base2-unsigned:
    name: Onnanoko6 unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.4
      vars:
        APP_NAME: Onnanoko6
        XCODE_PROJECT: Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        BUNDLE_ID: com.port.onnanoko6
        PROJECT_ZIP_URL: https://github.com/sxh1287056665/mgbuster-ios/releases/download/ios-unsigned-v1/ios-base2.zip
        EXPECT_UNITY: 2019.4.18f1
    scripts:
      - name: 鎷夊彇 Xcode 宸ョ▼
        script: |
          set -euo pipefail
          mkdir -p /tmp/proj
          curl -fL --retry 3 --retry-delay 5 --progress-bar \
            -o /tmp/project.zip "$PROJECT_ZIP_URL"
          ls -l /tmp/project.zip
          # 宸ョ▼鐢?Python zipfile 鐢熸垚锛堟鏂滄潬璺緞 + unix 鏉冮檺浣嶏級锛寀nzip 鍗冲彲
          unzip -q /tmp/project.zip -d /tmp/proj
          test -d "/tmp/proj/$XCODE_PROJECT"
          test -f "/tmp/proj/$XCODE_PROJECT/project.pbxproj"
          # zip 涓嶄繚鐣欏彲鎵ц浣嶏紝Unity 鐨?Run Script 闃舵浼氳皟鐢?MapFileParser.sh锛?          # 缂?+x 浼氬鑷?PhaseScriptExecution 鐩存帴澶辫触锛坰tatus 65锛?          find /tmp/proj -name '*.sh' -print -exec chmod +x {} \;
          chmod +x /tmp/proj/MapFileParser.sh /tmp/proj/process_symbols.sh 2>/dev/null || true
          # base3 鐨?process_symbols.sh 璋冪敤鍚岀洰褰?usymtool锛圡ach-O 鍙墽琛岋級锛屽悓鏍蜂涪鎵ц浣?          find /tmp/proj -maxdepth 1 -type f -exec chmod +x {} \;
          # usymtool 鏄?2019.2 闄勫甫鐨?x86 Mach-O锛屽湪 macOS 15/arm64 涓婃閿欒锛圫IGSEGV 11锛夛紝
          # 瀹冨彧璐熻矗鎶?IL2CPP 绗﹀彿鐏岃繘 dSYM锛屼笉鍙備笌浜х墿锛涙敼 no-op 璁╂瀯寤洪樁娈佃繑鍥?0
          if [ -f /tmp/proj/process_symbols.sh ]; then
            printf '#!/bin/sh\nexit 0\n' > /tmp/proj/process_symbols.sh
            chmod +x /tmp/proj/process_symbols.sh
            cat /tmp/proj/process_symbols.sh
          fi
          ls -l /tmp/proj > /tmp/top_ls.txt; sed -n '1,25p' /tmp/top_ls.txt
          echo "--- 椤跺眰 ---"
          ls -1 /tmp/proj
          echo "--- 鏉冮檺 ---"
          ls -l /tmp/proj/*.sh
          echo "--- 浣撶Н ---"
          du -sh /tmp/proj

      - name: 鏍￠獙骞跺厹搴曚慨琛ュ伐绋?        script: |
          set -euo pipefail
          cd /tmp/proj
          PBX="$XCODE_PROJECT/project.pbxproj"
          cp "$PBX" "$PBX.orig"
          # 骞傜瓑鍏滃簳锛氭湰鏈哄凡褰掍竴鍖栵紝杩欎簺鏇挎崲閫氬父 0 鍛戒腑锛屽彧涓洪槻鍥炲綊
          perl -0pi -e 's/ENABLE_BITCODE = YES/ENABLE_BITCODE = NO/g' "$PBX"
          perl -0pi -e 's/ARCHS = armv7;/ARCHS = arm64;/g' "$PBX"
          perl -0pi -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' "$PBX"
          # armv7 鏃朵唬鐨勭紪璇戝紑鍏筹紝arm64 clang 鐩存帴鎶?          #   clang: error: unsupported option '-mno-thumb' for target 'arm64-apple-ios12.0'
          perl -0pi -e 's/^[ \t]*"-mno-thumb",\r?\n//gm' "$PBX"
          perl -0pi -e 's/^[ \t]*GCC_THUMB_SUPPORT = NO;\r?\n//gm' "$PBX"

          echo "--- 纭柇瑷€ ---"
          test "$(grep -c 'ENABLE_BITCODE = YES' "$PBX" || true)" = "0"
          test "$(grep -c 'ARCHS = armv7;' "$PBX" || true)" = "0"
          test "$(grep -c 'iPhone Developer' "$PBX" || true)" = "0"
          test "$(grep -c 'mno-thumb' "$PBX" || true)" = "0"
          test "$(grep -c 'GCC_THUMB_SUPPORT' "$PBX" || true)" = "0"
          test "$(grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBX" || true)" -ge 1
          echo "bitcode=NO ok  arm64 ok  unsigned ok  no-thumb ok  bundle=${BUNDLE_ID}"

          # Info.plist 蹇呴』澹版槑 arm64 + metal锛屽惁鍒欑湡鏈轰笉瑁?          PLIST="$XCODE_PROJECT/../Info.plist"
          [ -f "$PLIST" ] || PLIST="Info.plist"
          grep -q '<string>arm64</string>' "$PLIST"
          grep -q '<string>metal</string>' "$PLIST"
          test "$(grep -c '<string>armv7</string>' "$PLIST" || true)" = "0"
          echo "Info.plist ok"

          echo "--- Live2D 閾炬帴锛坆ase3 鎵嶆湁锛宐ase2 涓?0锛?--"
          grep -c 'libLive2DCubismCore' "$PBX" || true

          echo "--- schemes ---"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: 缂栬瘧鏈鍚?.app
        script: |
          set -euo pipefail
          cd /tmp/proj
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log | tail -80
          grep -q 'BUILD SUCCEEDED' /tmp/xcodebuild.log
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -d "$APP"
          echo "APP=$APP"
          du -sh "$APP"

          echo "--- 浜х墿纭爣璁?---"
          test -f "$APP/Data/Managed/Metadata/global-metadata.dat" && echo "ok global-metadata"
          test -f "$APP/Data/globalgamemanagers" && echo "ok globalgamemanagers"
          test -f "$APP/Data/level0" && echo "ok level0"
          test -d "$APP/Frameworks/UnityFramework.framework" && echo "ok UnityFramework"
          echo "arch  : $(lipo -archs "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")")"
          echo "binary: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "minOS : $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "caps  : $(/usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist")"

      - name: 鎵撳寘 Payload 鏈鍚?ipa
        script: |
          set -euo pipefail
          APP=$(find /tmp/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          WORK=/tmp/ipa
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -a "$APP" "$WORK/Payload/"
          # UnityFramework 鐨?CFBundleIdentifier 蹇呴』鍖哄埆浜庝富 app锛屽惁鍒欒嚜绛惧伐鍏蜂細瑕嗙洊宓屽绛惧悕
          UF="$WORK/Payload/$(basename "$APP")/Frameworks/UnityFramework.framework"
          if [ -d "$UF" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}.framework" "$UF/Info.plist" || true
            echo "UnityFramework id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$UF/Info.plist")"
          fi
          cd "$WORK"
          # ASTC 宸插帇缂╋紝deflate 鍑犱箮鏃犳敹鐩婁笖鑰楁椂锛岀敤 store
          zip -0 -qry "/tmp/${APP_NAME}-unsigned.ipa" Payload
          ditto -c -k --keepParent "$APP" "/tmp/${APP_NAME}-app.zip"
          ls -lh /tmp/*.ipa /tmp/*.zip
          echo "--- ipa 鑷 ---"
          unzip -l "/tmp/${APP_NAME}-unsigned.ipa" > /tmp/ipa_list.txt
          sed -n '1,20p' /tmp/ipa_list.txt

    artifacts:
      - /tmp/*.ipa
      - /tmp/*-app.zip
      - /tmp/xcodebuild.log

