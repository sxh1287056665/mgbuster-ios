          # base3 鐨?process_symbols.sh 璋冪敤鍚岀洰褰?usymtool锛圡ach-O 鍙墽琛岋級锛屽悓鏍蜂涪鎵ц浣?          find /tmp/proj -maxdepth 1 -type f -exec chmod +x {} \;
